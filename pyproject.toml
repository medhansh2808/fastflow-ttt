[project]
name = "robo-ttt"
version = "0.2.0"
description = "Test-time training memory for the pi0.5 action head"
authors = [
    { name = "vruga" }
]
readme = "README.md"
requires-python = ">= 3.10"
license = { file = "LICENSE" }
keywords = [
    'artificial intelligence',
    'deep learning',
    'robotics',
    'test-time training',
    'context scaling'
]

classifiers=[
    'Development Status :: 4 - Beta',
    'Intended Audience :: Developers',
    'Topic :: Scientific/Engineering :: Artificial Intelligence',
    'License :: OSI Approved :: MIT License',
    'Programming Language :: Python :: 3.10',
]

dependencies = [
    "einx>=0.3.0",
    "einops>=0.8.1",
    "fast-weight-attention>=0.3.1",
    "fast-weight-product-key-memory>=0.2.2",
    "rotary-embedding-torch",
    "torch>=2.5",
    "torch-einops-utils>=0.1.27",
]

[project.urls]
Homepage = "https://github.com/vruga/fastflow-ttt"
Repository = "https://github.com/vruga/fastflow-ttt"

[project.optional-dependencies]
examples = []
test = [
    "pytest"
]

[tool.pytest.ini_options]
pythonpath = [
    "."
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.rye]
managed = true
dev-dependencies = []

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build]
include = [
    "robo_ttt",
    "pyproject.toml",
    "README.md",
    "LICENSE"
]

[tool.hatch.build.targets.wheel]
packages = ["robo_ttt"]
